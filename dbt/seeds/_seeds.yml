version: 2

seeds:
  - name: departments
    description: >
      French departments and their region (INSEE Code officiel géographique,
      2024 edition: 13 metropolitan regions + 5 overseas). Météo-France files and
      the SNCF stations export both use these INSEE department codes.
    columns:
      - name: department
        description: "INSEE department code (\"01\", \"2A\", \"974\")."
        data_tests: [not_null, unique]
      - name: department_name
        description: "Department name (INSEE COG)."
        data_tests: [not_null]
      - name: region_code
        description: "INSEE region code."
        data_tests: [not_null]
      - name: region_name
        description: "Region name (INSEE COG 2024)."
        data_tests: [not_null]
