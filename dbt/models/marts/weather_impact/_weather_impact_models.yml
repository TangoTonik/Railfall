version: 2

models:
  - name: int_route_month_weather
    description: >
      fact_route_month with the weather of both endpoint departments that month,
      combined into the worse of the two ends, and one `weather_condition` label
      (frost > wind > rain > calm, `unknown` without weather at either end).
    data_tests:
      - row_count_in_range:
          arguments:
            min_rows: 1
    columns:
      - name: route_month_id
        data_tests: [not_null, unique]
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_id
      - name: month
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month
      - name: is_wet
        data_tests: [not_null]
      - name: is_frosty
        data_tests: [not_null]
      - name: is_windy
        data_tests: [not_null]
      - name: max_precipitation_ratio
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: weather_coverage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["both", "departure_only", "arrival_only", "none"]
      - name: weather_condition
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["frost", "wind", "rain", "calm", "unknown"]

  - name: mart_punctuality_by_weather
    description: >
      Punctuality, cancellations and delay of route-months hit by rain, wind or
      frost against the route-months that were not, rates rebuilt from counts.
    data_tests:
      - row_count_in_range:
          arguments:
            min_rows: 1
      - unique_combination_of_columns:
          arguments:
            columns: [weather_factor, exposure]
    columns:
      - name: weather_exposure_id
        data_tests: [not_null, unique]
      - name: weather_factor
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rain", "wind", "frost"]
      - name: exposure
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["adverse", "normal"]
      - name: route_months
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: arrival_punctuality_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cancellation_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: punctuality_gap_pts
        description: Adverse minus normal arrival punctuality, in percentage points.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -100
                max_value: 100

  - name: mart_punctuality_by_region_season
    description: >
      The rain / wind / frost comparison of mart_punctuality_by_weather, cut by
      region (departure end, arrival as fallback) and meteorological season
      pooled across years. Sparse cells keep their row with a null gap;
      `has_comparison` marks the region-season-factors with both exposures.
    data_tests:
      - row_count_in_range:
          arguments:
            min_rows: 1
      - unique_combination_of_columns:
          arguments:
            columns: [region_code, season, weather_factor, exposure]
    columns:
      - name: region_season_exposure_id
        data_tests: [not_null, unique]
      - name: region_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('departments')
                field: region_code
      - name: region_name
        data_tests: [not_null]
      - name: season
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["winter", "spring", "summer", "autumn"]
      - name: weather_factor
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rain", "wind", "frost"]
      - name: exposure
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["adverse", "normal"]
      - name: route_months
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: years
        description: Distinct season-years pooled into the cell (December counts with the next winter).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: has_comparison
        data_tests: [not_null]
      - name: arrival_punctuality_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cancellation_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: punctuality_gap_pts
        description: Adverse minus normal arrival punctuality, in percentage points.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -100
                max_value: 100

  - name: mart_punctuality_by_weather_intensity
    description: >
      Punctuality graded by how hard each factor hit the route-month: rain as a
      ratio of the monthly normal, frost days, strong-wind days. One baseline
      band per factor; the gap columns compare every other band with it.
    data_tests:
      - row_count_in_range:
          arguments:
            min_rows: 1
      - unique_combination_of_columns:
          arguments:
            columns: [weather_factor, intensity_band]
      - unique_combination_of_columns:
          arguments:
            columns: [weather_factor, band_order]
    columns:
      - name: weather_intensity_id
        data_tests: [not_null, unique]
      - name: weather_factor
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rain", "wind", "frost"]
      - name: intensity_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["dry", "normal", "wet", "very_wet", "extreme",
                   "none", "light", "moderate", "hard", "severe", "strong"]
      - name: band_order
        description: 1 is the mildest band of the factor; sort by it to read a dose-response.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: is_baseline
        data_tests: [not_null]
      - name: route_months
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: min_intensity
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: arrival_punctuality_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cancellation_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: punctuality_gap_pts
        description: Band minus baseline arrival punctuality, in percentage points.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -100
                max_value: 100
