version: 2

models:
  - name: int_route_month_weather
    description: >
      fact_route_month with the weather of both endpoint departments that month,
      combined into the worse of the two ends, and one `weather_condition` label
      (frost > wind > rain > calm, `unknown` without weather at either end).
    columns:
      - name: route_month_id
        data_tests: [not_null, unique]
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_route')
                field: route_id
      - name: month
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month
      - name: is_wet
        data_tests: [not_null]
      - name: is_frosty
        data_tests: [not_null]
      - name: is_windy
        data_tests: [not_null]
      - name: max_precipitation_ratio
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: weather_coverage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["both", "departure_only", "arrival_only", "none"]
      - name: weather_condition
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["frost", "wind", "rain", "calm", "unknown"]

  - name: mart_punctuality_by_weather
    description: >
      Punctuality, cancellations and delay of route-months hit by rain, wind or
      frost against the route-months that were not, rates rebuilt from counts.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [weather_factor, exposure]
    columns:
      - name: weather_exposure_id
        data_tests: [not_null, unique]
      - name: weather_factor
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["rain", "wind", "frost"]
      - name: exposure
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["adverse", "normal"]
      - name: route_months
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: arrival_punctuality_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cancellation_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: punctuality_gap_pts
        description: Adverse minus normal arrival punctuality, in percentage points.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -100
                max_value: 100
