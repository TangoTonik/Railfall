version: 2

models:
  - name: stg_sncf__punctuality_monthly
    description: TGV punctuality per route-month, typed for the star schema.
    columns:
      - name: route_month_id
        description: Surrogate key md5(month | service | route_id).
        data_tests: [not_null, unique]
      - name: month
        data_tests: [not_null]
      - name: route_id
        data_tests: [not_null]
      - name: service
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["National", "International"]
      - name: trains_planned
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: trains_run
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: arrival_punctuality_rate
        description: Share of trains run arriving on time (0-1); null when no train ran.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cancellation_rate
        description: Cancelled / planned trains (0-1); null when nothing was planned.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_cause_external
        description: >
          Share of late trains attributed to external causes, in percent (0-100).
          The six cause shares come straight from AQST and are only range-checked,
          as a warning: the published shares are rounded and occasionally drift.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                severity: warn

  - name: stg_meteo__weather_daily
    description: Daily weather per Météo-France station.
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: day
        data_tests: [not_null]
      - name: department
        data_tests: [not_null]
      # Silver's physical bounds (railfall.spark.weather.BOUNDS), re-checked on
      # the warehouse; tests/test_dbt_project.py keeps the two in sync.
      - name: precipitation_mm
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 500
      - name: temp_min_c
        data_tests:
          - accepted_range:
              arguments:
                min_value: -50
                max_value: 50
      - name: temp_max_c
        data_tests:
          - accepted_range:
              arguments:
                min_value: -50
                max_value: 50
      - name: temp_mean_c
        data_tests:
          - accepted_range:
              arguments:
                min_value: -50
                max_value: 50
      - name: wind_mean_ms
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: wind_max_hourly_ms
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [station_id, day]

  - name: stg_sncf__stations
    description: SNCF passenger stations, one row per UIC code.
    columns:
      - name: uic_code
        data_tests: [not_null, unique]
      - name: department
        data_tests: [not_null]

  - name: stg_meteo__weather_monthly
    description: Weather per department and month (coverage-aware Spark roll-up).
    columns:
      - name: department_month_id
        description: Surrogate key md5(department | month).
        data_tests: [not_null, unique]
      - name: department
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: stations
        description: Distinct stations that reported in the department that month.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      # Day counts are scaled to the month length, so they are averages, not
      # integers, but never more than 31.
      - name: rain_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 31
      - name: heavy_rain_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 31
      - name: frost_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 31
      - name: strong_wind_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 31
      - name: precipitation_mm
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns: [department, month]

  - name: stg_sncf__route_departments
    description: TGV route -> endpoint departments, with the match method per side.
    columns:
      - name: route_id
        data_tests: [not_null, unique]
      - name: departure_match
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["alias", "foreign", "exact", "prefix", "unmatched"]
      - name: arrival_match
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["alias", "foreign", "exact", "prefix", "unmatched"]
      - name: is_domestic
        data_tests: [not_null]
