# Connection profile. Every value comes from the environment (see .env.example);
# defaults target the local Docker Compose stack and the least-privilege
# `railfall_transformer` role Terraform creates (reads raw, owns staging/marts).
railfall:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', env_var('POSTGRES_PORT', '5432')) | int }}"
      user: "{{ env_var('DBT_USER', 'railfall_transformer') }}"
      password: "{{ env_var('DBT_PASSWORD', env_var('TF_VAR_warehouse_transformer_password', 'transformer-local')) }}"
      dbname: "{{ env_var('DBT_DBNAME', env_var('POSTGRES_DB', 'warehouse')) }}"
      # Default schema only; models set their own (staging, marts).
      schema: staging
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
      keepalives_idle: 0
