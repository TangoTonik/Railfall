[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railfall"
dynamic = ["version"]
description = "Data platform joining SNCF punctuality and Météo-France weather open data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3", "pyyaml>=6", "moto[s3]>=5", "python-hcl2>=7", "pyspark>=4.0,<4.1", "dbt-core>=1.12,<1.13", "dbt-postgres>=1.10,<1.11", "great_expectations[postgresql]>=1.5,<2", "numpy>=1.26", "matplotlib>=3.8"]
spark = ["pyspark>=4.0,<4.1"]
dbt = ["dbt-core>=1.12,<1.13", "dbt-postgres>=1.10,<1.11"]
quality = ["great_expectations[postgresql]>=1.5,<2"]
analysis = ["numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools.dynamic]
version = {attr = "railfall.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["spark: needs a local JVM to run PySpark (skipped when java is missing)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
