name: e2e

# Boots the real Docker Compose stack and runs the pipeline as far as it exists.
# No mocks here: every step talks to real services (see CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install railfall
        run: pip install -e .

      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet

      - name: Boot stack (build MinIO, wait healthy, create bucket)
        # Same entry point as local dev; `.env` is exported to the health checks too.
        # No public MinIO images exist any more; see infra/minio/Dockerfile.
        run: make up

      - name: Health-check platform
        run: make health WAIT=60

      - name: Write round-trip (lake + warehouse)
        run: make smoke WAIT=0

      - name: Bucket init is idempotent
        run: docker compose run --rm minio-init

      - name: Data survives a restart
        # `down` keeps the named volumes. Restart *without* minio-init: the
        # lake-bucket check only passes if the bucket persisted on disk.
        run: |
          docker compose down
          docker compose up -d --wait postgres minio
          make health WAIT=60

      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
