name: e2e

# Boots the real Docker Compose stack and runs the pipeline as far as it exists.
# No mocks here: every step talks to real services (see CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          # Spark 4.0 needs Java 17+.
          distribution: temurin
          java-version: "17"

      - name: Install railfall (with Spark)
        run: pip install -e ".[spark]"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper rewrites stdout/exit codes; plan -detailed-exitcode needs the raw binary.
          terraform_wrapper: false

      - name: Terraform fmt + validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -input=false -backend=false
          terraform -chdir=infra/terraform validate

      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet

      - name: Boot stack (build MinIO, wait healthy, terraform apply)
        # Same entry point as local dev; `.env` is exported to Terraform and the
        # health checks too.
        # No public MinIO images exist any more; see infra/minio/Dockerfile.
        run: make up

      - name: Health-check platform
        run: make health WAIT=60

      - name: Write round-trip (lake + warehouse) as the pipeline identities
        # `.env` points the app at the Terraform-managed users, not the admins:
        # the round-trip only passes if those grants are enough to do the job.
        run: |
          out=$(make --no-print-directory smoke WAIT=0)
          echo "$out"
          echo "$out" | grep -E '^\[ +ok\] +postgres .* as railfall_loader$'

      - name: Terraform state matches the real stack
        # A second plan right after apply must be empty (exit 0, not 2): the
        # config is idempotent and providers read back what they created.
        run: make infra-check

      - name: Terraform outputs
        run: |
          out=$(terraform -chdir=infra/terraform output -json)
          echo "$out"
          echo "$out" | jq -e '.lake_bucket.value == "railfall-lake"'
          echo "$out" | jq -e '.lake_layers.value == ["bronze/", "silver/"]'
          echo "$out" | jq -e '.warehouse_schemas.value == ["marts", "raw", "staging"]'
          echo "$out" | jq -e '.warehouse_roles.value | keys == ["loader", "reader", "transformer"]'

      - name: Least-privilege audit (pipeline identities)
        # Connects as the lake pipeline user and each warehouse role created by
        # Terraform: allowed actions must succeed, forbidden ones must be refused.
        run: make access

      - name: Ingest SNCF open data into bronze (real download)
        # Real Opendatasoft exports, real MinIO, the pipeline identity: the
        # contract (fields, types, row floors) is enforced before anything lands.
        run: |
          make -s ingest-sncf INGEST_ARGS=--json | tee ingest-1.json
          jq -e 'length == 2 and all(.[]; .ok and .status == "written")' ingest-1.json
          jq -e '.[] | select(.dataset == "punctuality") | .rows >= 5000' ingest-1.json
          jq -e '.[] | select(.dataset == "stations") | .rows >= 2000' ingest-1.json

      - name: Bronze holds what ingest reported
        # Read back from the lake: one version per day, SHA-256 and row counts
        # agree with the manifest, payload still passes the schema contract.
        run: |
          make --no-print-directory verify-sncf
          make -s verify-sncf INGEST_ARGS=--json > verify.json
          jq -e --slurpfile ing ingest-1.json \
            '[.[] | {dataset, rows}] == [$ing[0][] | {dataset, rows}]' verify.json

      - name: Re-running ingestion does not duplicate bronze
        # Same day, same bytes -> skipped. If SNCF republished in between, the
        # day's object is replaced, never doubled; verify proves it either way.
        run: |
          make -s ingest-sncf INGEST_ARGS=--json | tee ingest-2.json
          jq -e 'all(.[]; .ok and (.status == "skipped" or .status == "replaced"))' ingest-2.json
          make --no-print-directory verify-sncf
          # Whole-prefix count, as the pipeline user: 2 datasets x (payload + manifest).
          keys=$(make -s verify-sncf INGEST_ARGS=--list)
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -eq 4

      - name: Ingest Météo-France daily files into bronze (real download)
        # METEO_DEPARTMENTS from .env (75, 69, 13): resolved from the live
        # data.gouv.fr catalogue, downloaded from object.files.data.gouv.fr and
        # checked against the contract (columns, department, numeric measures).
        run: |
          make -s ingest-meteo INGEST_ARGS=--json | tee meteo-1.json
          jq -e 'length == 3 and all(.[]; .ok and .status == "written")' meteo-1.json
          jq -e '[.[].dataset] | sort == ["daily_13_latest", "daily_69_latest", "daily_75_latest"]' meteo-1.json
          jq -e 'all(.[]; .rows >= 1000)' meteo-1.json

      - name: Météo-France bronze holds what ingest reported
        run: |
          make --no-print-directory verify-meteo
          make -s verify-meteo INGEST_ARGS=--json > verify-meteo.json
          jq -e --slurpfile ing meteo-1.json \
            '[.[] | {dataset, rows}] == [$ing[0][] | {dataset, rows}]' verify-meteo.json

      - name: Re-running Météo-France ingestion does not duplicate bronze
        run: |
          make -s ingest-meteo INGEST_ARGS=--json | tee meteo-2.json
          jq -e 'all(.[]; .ok and (.status == "skipped" or .status == "replaced"))' meteo-2.json
          make --no-print-directory verify-meteo
          # 3 departments x (csv.gz + manifest).
          keys=$(make -s verify-meteo INGEST_ARGS=--list)
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -eq 6

      - name: Build silver from the real bronze (Spark over S3A)
        # Real Spark reading the real bronze through S3A as the pipeline user.
        # Reports go to files: the JVM shares stdout with Python.
        run: |
          make --no-print-directory silver SILVER_ARGS="--report silver-1.json"
          cat silver-1.json
          jq -e 'length == 3 and all(.[]; .ok)' silver-1.json
          jq -e '.[] | select(.table == "punctuality_monthly") | .rows >= 4000' silver-1.json
          jq -e '.[] | select(.table == "stations") | .rows >= 1500' silver-1.json
          jq -e '.[] | select(.table == "weather_daily") | .rows >= 3000' silver-1.json
          # Silver only cleans and de-duplicates: it never invents punctuality rows.
          jq -e --slurpfile ing ingest-1.json '
            (.[] | select(.table == "punctuality_monthly") | .rows + .rejected)
            <= ($ing[0][] | select(.dataset == "punctuality") | .rows)' silver-1.json

      - name: Silver passes its contract (schema, unique keys)
        run: |
          make --no-print-directory verify-silver SILVER_ARGS="--report verify-silver-1.json"
          jq -e 'length == 3 and all(.[]; .ok and .duplicate_keys == 0 and .null_keys == 0)' \
            verify-silver-1.json
          jq -e --slurpfile job silver-1.json \
            '[.[] | {table, rows}] == [$job[0][] | {table, rows}]' verify-silver-1.json

      - name: Re-running silver does not duplicate rows
        # Partition overwrite: same bronze in, same row counts out, keys still unique.
        run: |
          make --no-print-directory silver SILVER_ARGS="--report silver-2.json"
          jq -e --slurpfile one silver-1.json \
            '[.[] | {table, rows, rejected}] == [$one[0][] | {table, rows, rejected}]' silver-2.json
          make --no-print-directory verify-silver SILVER_ARGS="--report verify-silver-2.json"
          jq -e --slurpfile one verify-silver-1.json \
            '[.[] | {table, rows}] == [$one[0][] | {table, rows}] and all(.[]; .ok)' \
            verify-silver-2.json

      - name: Re-apply is a no-op
        run: |
          make infra
          make infra-check

      - name: Data survives a restart
        # `down` keeps the named volumes. Restart *without* Terraform: the
        # lake-bucket check only passes if the bucket persisted on disk, and
        # the drift check proves roles and schemas survived too.
        run: |
          docker compose down
          docker compose up -d --wait postgres minio
          make health WAIT=60
          make infra-check
          make access
          make --no-print-directory verify-sncf
          make --no-print-directory verify-meteo
          make --no-print-directory verify-silver

      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
