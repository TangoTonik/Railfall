name: e2e

# Boots the real Docker Compose stack and runs the pipeline as far as it exists.
# No mocks here: every step talks to real services (see CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Airflow image build + a DAG run add ~8 minutes to the Spark/load stages.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          # Spark 4.0 needs Java 17+.
          distribution: temurin
          java-version: "17"

      - name: Install railfall (with Spark)
        run: pip install -e ".[spark]"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper rewrites stdout/exit codes; plan -detailed-exitcode needs the raw binary.
          terraform_wrapper: false

      - name: Terraform fmt + validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          # Provider downloads hit the registry and GitHub releases; a 500 there
          # (e2e run 39) is not a failure of ours, so init is retried.
          make infra-init
          terraform -chdir=infra/terraform validate

      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet

      - name: Boot stack (build MinIO, wait healthy, terraform apply)
        # Same entry point as local dev; `.env` is exported to Terraform and the
        # health checks too.
        # No public MinIO images exist any more; see infra/minio/Dockerfile.
        run: make up

      - name: Health-check platform
        run: make health WAIT=60

      - name: Write round-trip (lake + warehouse) as the pipeline identities
        # `.env` points the app at the Terraform-managed users, not the admins:
        # the round-trip only passes if those grants are enough to do the job.
        run: |
          out=$(make --no-print-directory smoke WAIT=0)
          echo "$out"
          echo "$out" | grep -E '^\[ +ok\] +postgres .* as railfall_loader$'

      - name: Terraform state matches the real stack
        # A second plan right after apply must be empty (exit 0, not 2): the
        # config is idempotent and providers read back what they created.
        run: make infra-check

      - name: Terraform outputs
        run: |
          out=$(terraform -chdir=infra/terraform output -json)
          echo "$out"
          echo "$out" | jq -e '.lake_bucket.value == "railfall-lake"'
          echo "$out" | jq -e '.lake_layers.value == ["bronze/", "silver/"]'
          echo "$out" | jq -e '.warehouse_schemas.value == ["marts", "raw", "staging"]'
          echo "$out" | jq -e '.warehouse_roles.value | keys == ["loader", "reader", "transformer"]'

      - name: Least-privilege audit (pipeline identities)
        # Connects as the lake pipeline user and each warehouse role created by
        # Terraform: allowed actions must succeed, forbidden ones must be refused.
        run: make access

      - name: Ingest SNCF open data into bronze (real download)
        # Real Opendatasoft exports, real MinIO, the pipeline identity: the
        # contract (fields, types, row floors) is enforced before anything lands.
        run: |
          make -s ingest-sncf INGEST_ARGS=--json | tee ingest-1.json
          jq -e 'length == 2 and all(.[]; .ok and .status == "written")' ingest-1.json
          jq -e '.[] | select(.dataset == "punctuality") | .rows >= 5000' ingest-1.json
          jq -e '.[] | select(.dataset == "stations") | .rows >= 2000' ingest-1.json

      - name: Bronze holds what ingest reported
        # Read back from the lake: one version per day, SHA-256 and row counts
        # agree with the manifest, payload still passes the schema contract.
        run: |
          make --no-print-directory verify-sncf
          make -s verify-sncf INGEST_ARGS=--json > verify.json
          jq -e --slurpfile ing ingest-1.json \
            '[.[] | {dataset, rows}] == [$ing[0][] | {dataset, rows}]' verify.json

      - name: Re-running ingestion does not duplicate bronze
        # Same day, same bytes -> skipped. If SNCF republished in between, the
        # day's object is replaced, never doubled; verify proves it either way.
        run: |
          make -s ingest-sncf INGEST_ARGS=--json | tee ingest-2.json
          jq -e 'all(.[]; .ok and (.status == "skipped" or .status == "replaced"))' ingest-2.json
          make --no-print-directory verify-sncf
          # Whole-prefix count, as the pipeline user: 2 datasets x (payload + manifest).
          keys=$(make -s verify-sncf INGEST_ARGS=--list)
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -eq 4

      - name: Ingest Météo-France daily files into bronze (real download)
        # METEO_DEPARTMENTS from .env (75, 69, 13): resolved from the live
        # data.gouv.fr catalogue, downloaded from object.files.data.gouv.fr and
        # checked against the contract (columns, department, numeric measures).
        run: |
          make -s ingest-meteo INGEST_ARGS=--json | tee meteo-1.json
          jq -e 'length == 3 and all(.[]; .ok and .status == "written")' meteo-1.json
          jq -e '[.[].dataset] | sort == ["daily_13_latest", "daily_69_latest", "daily_75_latest"]' meteo-1.json
          jq -e 'all(.[]; .rows >= 1000)' meteo-1.json

      - name: Météo-France bronze holds what ingest reported
        run: |
          make --no-print-directory verify-meteo
          make -s verify-meteo INGEST_ARGS=--json > verify-meteo.json
          jq -e --slurpfile ing meteo-1.json \
            '[.[] | {dataset, rows}] == [$ing[0][] | {dataset, rows}]' verify-meteo.json

      - name: Re-running Météo-France ingestion does not duplicate bronze
        run: |
          make -s ingest-meteo INGEST_ARGS=--json | tee meteo-2.json
          jq -e 'all(.[]; .ok and (.status == "skipped" or .status == "replaced"))' meteo-2.json
          make --no-print-directory verify-meteo
          # 3 departments x (csv.gz + manifest).
          keys=$(make -s verify-meteo INGEST_ARGS=--list)
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -eq 6

      - name: Start Airflow (build image, migrate metadata DB, wait healthy)
        # Needs `make up` first: Terraform owns the Airflow database and role.
        run: |
          make airflow
          curl -fsS "http://localhost:8080/health" | jq -e \
            '.metadatabase.status == "healthy" and .scheduler.status == "healthy"'

      - name: railfall_ingest DAG runs to success on the real sources
        # Triggered over the REST API and awaited; the tasks download the real
        # SNCF and Météo-France files inside the Airflow containers. Same
        # partition as the CLI steps above, so bronze must not grow.
        run: |
          make dag-run DAG=railfall_ingest \
            DAG_ARGS="--conf '{\"ingest_date\": \"$(date -u +%F)\"}' --timeout 900 --report dag-ingest.json"
          jq -e '.state == "success"' dag-ingest.json
          jq -e '[.tasks[] | select(.state != "success")] | length == 0' dag-ingest.json
          jq -e '[.tasks[] | select(.task_id == "ingest_meteo")] | length == 3' dag-ingest.json
          jq -e '[.tasks[].task_id] | unique
            == ["ingest_meteo", "ingest_sncf", "verify_meteo", "verify_sncf"]' dag-ingest.json

      - name: DAG run left bronze valid and unduplicated
        run: |
          make --no-print-directory verify-sncf
          make --no-print-directory verify-meteo
          test "$(make -s verify-sncf INGEST_ARGS=--list | wc -l)" -eq 4
          test "$(make -s verify-meteo INGEST_ARGS=--list | wc -l)" -eq 6

      - name: Remove Airflow containers (frees memory for Spark)
        # Removed, not stopped: the restart step's plain `docker compose down`
        # must not trip over profile containers. Its metadata stays in Postgres.
        run: docker compose --profile airflow rm --stop --force airflow-webserver airflow-scheduler airflow-init

      - name: Build silver from the real bronze (Spark over S3A)
        # Real Spark reading the real bronze through S3A as the pipeline user.
        # Reports go to files: the JVM shares stdout with Python.
        run: |
          make --no-print-directory silver SILVER_ARGS="--report silver-1.json"
          cat silver-1.json
          jq -e 'length == 6 and all(.[]; .ok)' silver-1.json
          jq -e '.[] | select(.table == "punctuality_monthly") | .rows >= 4000' silver-1.json
          jq -e '.[] | select(.table == "stations") | .rows >= 1500' silver-1.json
          jq -e '.[] | select(.table == "weather_daily") | .rows >= 3000' silver-1.json
          # Derived tables: 3 departments x 12+ covered months; ~100+ TGV routes.
          jq -e '.[] | select(.table == "weather_monthly") | .rows >= 36' silver-1.json
          jq -e '.[] | select(.table == "route_departments") | .rows >= 100' silver-1.json
          # The weather join keeps the punctuality grain: never loses or adds a row.
          jq -e '(.[] | select(.table == "route_weather_monthly") | .rows)
            == (.[] | select(.table == "punctuality_monthly") | .rows)' silver-1.json
          # Silver only cleans and de-duplicates: it never invents punctuality rows.
          jq -e --slurpfile ing ingest-1.json '
            (.[] | select(.table == "punctuality_monthly") | .rows + .rejected)
            <= ($ing[0][] | select(.dataset == "punctuality") | .rows)' silver-1.json

      - name: Silver passes its contract (schema, unique keys)
        run: |
          make --no-print-directory verify-silver SILVER_ARGS="--report verify-silver-1.json"
          jq -e 'length == 6 and all(.[]; .ok and .duplicate_keys == 0 and .null_keys == 0)' \
            verify-silver-1.json
          jq -e --slurpfile job silver-1.json \
            '[.[] | {table, rows}] == [$job[0][] | {table, rows}]' verify-silver-1.json
          # The join must match, not just keep its grain: with weather for Paris,
          # Lyon and Marseille, the routes between them carry weather at both ends.
          jq '.[] | select(.profile != {}) | {table, profile}' verify-silver-1.json
          jq -e '.[] | select(.table == "route_weather_monthly") | .profile.weather_endpoints
            | (.["2"] // 0) >= 12 and ((.["1"] // 0) + (.["2"] // 0)) >= 24' verify-silver-1.json
          jq -e '.[] | select(.table == "route_weather_monthly")
            | ([.profile.weather_endpoints[]] | add) == .rows' verify-silver-1.json

      - name: Re-running silver does not duplicate rows
        # Partition overwrite: same bronze in, same row counts out, keys still unique.
        run: |
          make --no-print-directory silver SILVER_ARGS="--report silver-2.json"
          jq -e --slurpfile one silver-1.json \
            '[.[] | {table, rows, rejected}] == [$one[0][] | {table, rows, rejected}]' silver-2.json
          make --no-print-directory verify-silver SILVER_ARGS="--report verify-silver-2.json"
          jq -e --slurpfile one verify-silver-1.json \
            '[.[] | {table, rows}] == [$one[0][] | {table, rows}] and all(.[]; .ok)' \
            verify-silver-2.json

      - name: Load silver into the warehouse raw schema (Spark -> Postgres)
        # Real silver over S3A, real Postgres as railfall_loader (WAREHOUSE_DSN
        # from .env). Fresh warehouse: every staged row is an insert.
        run: |
          make --no-print-directory load LOAD_ARGS="--report load-1.json"
          cat load-1.json
          jq -e 'length == 6 and all(.[]; .ok and .scope == "full")' load-1.json
          jq -e 'all(.[]; .staged > 0 and .inserted == .staged and .updated == 0 and .deleted == 0)' \
            load-1.json
          # The warehouse gets exactly what silver built, table by table.
          jq -e --slurpfile silver silver-2.json \
            '([.[] | {table, rows: .staged}] | sort_by(.table))
             == ([$silver[0][] | {table, rows}] | sort_by(.table))' load-1.json

      - name: Warehouse matches silver (columns, primary key, counts per year)
        run: |
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-1.json"
          jq -e 'length == 6 and all(.[]; .ok and .duplicate_keys == 0 and .null_keys == 0)' \
            verify-load-1.json
          jq -e 'all(.[]; .rows == .silver_rows and (.primary_key | length) > 0)' verify-load-1.json
          jq -e '.[] | select(.table == "punctuality_monthly") | .by_year | length >= 1' \
            verify-load-1.json

      - name: Re-running the load does not duplicate or rewrite rows
        # Same silver in -> nothing inserted, updated or deleted; counts unchanged.
        run: |
          make --no-print-directory load LOAD_ARGS="--report load-2.json"
          cat load-2.json
          jq -e 'length == 6 and all(.[]; .ok)' load-2.json
          jq -e 'all(.[]; .inserted == 0 and .updated == 0 and .deleted == 0
            and .unchanged == .staged)' load-2.json
          # Each run is logged under its own run_id, shared by all its tables.
          jq -e --slurpfile one load-1.json \
            '([.[].run_id] | unique | length == 1)
             and .[0].run_id != $one[0][0].run_id and .[0].run_id != ""' load-2.json
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-2.json"
          jq -e --slurpfile one verify-load-1.json \
            '[.[] | {table, rows, by_year}] == [$one[0][] | {table, rows, by_year}]
             and all(.[]; .ok and .duplicate_keys == 0)' verify-load-2.json

      - name: Incremental load of the latest year repairs only that year
        # Simulate drift as the admin: drop the latest year of punctuality from
        # the warehouse. `--year` must restore exactly those rows, leave every
        # other year untouched, and still reload the small reference tables in full.
        run: |
          year=$(jq -r '.[] | select(.table == "punctuality_monthly") | .by_year | keys
            | map(tonumber) | max' verify-load-1.json)
          echo "latest year: $year"
          docker compose exec -T postgres psql -U rail -d warehouse -v ON_ERROR_STOP=1 \
            -c "delete from raw.punctuality_monthly where year = $year"
          make --no-print-directory load LOAD_ARGS="--year $year --report load-3.json"
          cat load-3.json
          jq -e 'length == 6 and all(.[]; .ok and .updated == 0 and .deleted == 0)' load-3.json
          # Year-partitioned tables are scoped to $year and stage exactly its rows;
          # unpartitioned ones load in full.
          jq -e --slurpfile v verify-load-1.json --arg y "$year" '
            ($v[0] | map({(.table): .by_year}) | add) as $by
            | all(.[]; if ($by[.table] | length) > 0
                then .scope == ("year=" + $y) and .staged == ($by[.table][$y] // 0)
                else .scope == "full" end)' load-3.json
          # Only the dropped rows come back; everything else is a no-op.
          jq -e --slurpfile v verify-load-1.json --arg y "$year" '
            ($v[0][] | select(.table == "punctuality_monthly") | .by_year[$y]) as $n
            | $n > 0
              and (.[] | select(.table == "punctuality_monthly") | .inserted == $n)
              and ([.[] | select(.table != "punctuality_monthly") | .inserted] | add == 0)
            ' load-3.json
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-3.json"
          jq -e --slurpfile one verify-load-1.json \
            '[.[] | {table, rows, by_year}] == [$one[0][] | {table, rows, by_year}]
             and all(.[]; .ok and .duplicate_keys == 0)' verify-load-3.json

      - name: Re-apply is a no-op
        run: |
          make infra
          make infra-check

      - name: Data survives a restart
        # `down` keeps the named volumes. Restart *without* Terraform: the
        # lake-bucket check only passes if the bucket persisted on disk, and
        # the drift check proves roles and schemas survived too.
        run: |
          docker compose down
          docker compose up -d --wait postgres minio
          make health WAIT=60
          make infra-check
          make access
          make --no-print-directory verify-sncf
          make --no-print-directory verify-meteo
          make --no-print-directory verify-silver
          make --no-print-directory verify-load

      - name: Dump service logs
        if: failure()
        run: docker compose --profile airflow logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile airflow down -v
