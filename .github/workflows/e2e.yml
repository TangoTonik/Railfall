name: e2e

# Boots the real Docker Compose stack and runs the pipeline as far as it exists.
# No mocks here: every step talks to real services (see CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Airflow image build + the ingest DAG add ~8 minutes to the Spark/load
    # stages; the full pipeline DAG re-runs Spark and the load inside Airflow.
    timeout-minutes: 70
    env:
      # data.gouv.fr sometimes stalls for tens of seconds (e2e run 43866930429
      # timed out on 4 attempts within 7 s of backoff): be patient with it here.
      HTTP_TIMEOUT_S: "60"
      HTTP_MAX_RETRIES: "5"
      HTTP_BACKOFF_S: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          # Spark 4.0 needs Java 17+.
          distribution: temurin
          java-version: "17"

      - name: Install railfall (with Spark, dbt and Great Expectations)
        run: pip install -e ".[spark,dbt,quality]"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper rewrites stdout/exit codes; plan -detailed-exitcode needs the raw binary.
          terraform_wrapper: false

      - name: Terraform fmt + validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          # Provider downloads hit the registry and GitHub releases; a 500 there
          # (e2e run 39) is not a failure of ours, so init is retried.
          make infra-init
          terraform -chdir=infra/terraform validate

      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet

      - name: Boot stack (build MinIO, wait healthy, terraform apply)
        # Same entry point as local dev; `.env` is exported to Terraform and the
        # health checks too.
        # No public MinIO images exist any more; see infra/minio/Dockerfile.
        run: make up

      - name: Health-check platform
        run: make health WAIT=60

      - name: Write round-trip (lake + warehouse) as the pipeline identities
        # `.env` points the app at the Terraform-managed users, not the admins:
        # the round-trip only passes if those grants are enough to do the job.
        run: |
          out=$(make --no-print-directory smoke WAIT=0)
          echo "$out"
          echo "$out" | grep -E '^\[ +ok\] +postgres .* as railfall_loader$'

      - name: Terraform state matches the real stack
        # A second plan right after apply must be empty (exit 0, not 2): the
        # config is idempotent and providers read back what they created.
        run: make infra-check

      - name: Terraform outputs
        run: |
          out=$(terraform -chdir=infra/terraform output -json)
          echo "$out"
          echo "$out" | jq -e '.lake_bucket.value == "railfall-lake"'
          echo "$out" | jq -e '.lake_layers.value == ["bronze/", "silver/"]'
          echo "$out" | jq -e '.warehouse_schemas.value == ["marts", "raw", "staging"]'
          echo "$out" | jq -e '.warehouse_roles.value | keys == ["loader", "reader", "transformer"]'

      - name: Least-privilege audit (pipeline identities)
        # Connects as the lake pipeline user and each warehouse role created by
        # Terraform: allowed actions must succeed, forbidden ones must be refused.
        run: make access

      - name: Ingest SNCF open data into bronze (real download)
        # Real Opendatasoft exports, real MinIO, the pipeline identity: the
        # contract (fields, types, row floors) is enforced before anything lands.
        run: |
          make -s ingest-sncf INGEST_ARGS=--json | tee ingest-1.json
          jq -e 'length == 2 and all(.[]; .ok and .status == "written")' ingest-1.json
          jq -e '.[] | select(.dataset == "punctuality") | .rows >= 5000' ingest-1.json
          jq -e '.[] | select(.dataset == "stations") | .rows >= 2000' ingest-1.json

      - name: Bronze holds what ingest reported
        # Read back from the lake: one version per day, SHA-256 and row counts
        # agree with the manifest, payload still passes the schema contract.
        run: |
          make --no-print-directory verify-sncf
          make -s verify-sncf INGEST_ARGS=--json > verify.json
          jq -e --slurpfile ing ingest-1.json \
            '[.[] | {dataset, rows}] == [$ing[0][] | {dataset, rows}]' verify.json

      - name: Re-running ingestion does not duplicate bronze
        # Same day, same bytes -> skipped. If SNCF republished in between, the
        # day's object is replaced, never doubled; verify proves it either way.
        run: |
          make -s ingest-sncf INGEST_ARGS=--json | tee ingest-2.json
          jq -e 'all(.[]; .ok and (.status == "skipped" or .status == "replaced"))' ingest-2.json
          make --no-print-directory verify-sncf
          # Whole-prefix count, as the pipeline user: 2 datasets x (payload + manifest).
          keys=$(make -s verify-sncf INGEST_ARGS=--list)
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -eq 4

      - name: Ingest Météo-France daily files into bronze (real download)
        # METEO_DEPARTMENTS from .env (75, 69, 13): resolved from the live
        # data.gouv.fr catalogue, downloaded from object.files.data.gouv.fr and
        # checked against the contract (columns, department, numeric measures).
        run: |
          make -s ingest-meteo INGEST_ARGS=--json | tee meteo-1.json
          jq -e 'length == 3 and all(.[]; .ok and .status == "written")' meteo-1.json
          jq -e '[.[].dataset] | sort == ["daily_13_latest", "daily_69_latest", "daily_75_latest"]' meteo-1.json
          jq -e 'all(.[]; .rows >= 1000)' meteo-1.json

      - name: Météo-France bronze holds what ingest reported
        run: |
          make --no-print-directory verify-meteo
          make -s verify-meteo INGEST_ARGS=--json > verify-meteo.json
          jq -e --slurpfile ing meteo-1.json \
            '[.[] | {dataset, rows}] == [$ing[0][] | {dataset, rows}]' verify-meteo.json

      - name: Re-running Météo-France ingestion does not duplicate bronze
        run: |
          make -s ingest-meteo INGEST_ARGS=--json | tee meteo-2.json
          jq -e 'all(.[]; .ok and (.status == "skipped" or .status == "replaced"))' meteo-2.json
          make --no-print-directory verify-meteo
          # 3 departments x (csv.gz + manifest).
          keys=$(make -s verify-meteo INGEST_ARGS=--list)
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -eq 6

      - name: Start Airflow (build image, migrate metadata DB, wait healthy)
        # Needs `make up` first: Terraform owns the Airflow database and role.
        # Timetable runs are off: unpausing a daily DAG would otherwise start a
        # catch-up run of the latest interval beside the one we trigger.
        run: |
          make airflow AIRFLOW_USE_JOB_SCHEDULE=false
          curl -fsS "http://localhost:8080/health" | jq -e \
            '.metadatabase.status == "healthy" and .scheduler.status == "healthy"'

      - name: railfall_ingest DAG runs to success on the real sources
        # Triggered over the REST API and awaited; the tasks download the real
        # SNCF and Météo-France files inside the Airflow containers. Same
        # partition as the CLI steps above, so bronze must not grow.
        run: |
          make dag-run DAG=railfall_ingest \
            DAG_ARGS="--conf '{\"ingest_date\": \"$(date -u +%F)\"}' --timeout 900 --xcom --report dag-ingest.json"
          jq -e '.state == "success"' dag-ingest.json
          jq -e '[.tasks[] | select(.state != "success")] | length == 0' dag-ingest.json
          jq -e '[.tasks[] | select(.task_id == "ingest_meteo")] | length == 3' dag-ingest.json
          jq -e '[.tasks[].task_id] | unique
            == ["ingest_meteo", "ingest_sncf", "verify_meteo", "verify_sncf"]' dag-ingest.json
          # What the tasks returned: bronze already held this partition from the
          # CLI steps, so the DAG lands nothing new (skipped, or replaced if a
          # source republished in between) and its checks cover the same datasets.
          jq -e '[.tasks[] | select(.task_id | startswith("ingest_")) | .result[]]
            | length == 5 and all(.ok and (.status == "skipped" or .status == "replaced"))' \
            dag-ingest.json
          jq -e --slurpfile ing meteo-1.json \
            '[.tasks[] | select(.task_id == "verify_meteo") | .result[]]
              | all(.ok and .rows >= 1000)
                and ([.[].dataset] | sort) == ([$ing[0][].dataset] | sort)' dag-ingest.json

      - name: DAG run left bronze valid and unduplicated
        run: |
          make --no-print-directory verify-sncf
          make --no-print-directory verify-meteo
          test "$(make -s verify-sncf INGEST_ARGS=--list | wc -l)" -eq 4
          test "$(make -s verify-meteo INGEST_ARGS=--list | wc -l)" -eq 6

      - name: Remove Airflow containers (frees memory for Spark)
        # Removed, not stopped: the restart step's plain `docker compose down`
        # must not trip over profile containers. Its metadata stays in Postgres.
        run: docker compose --profile airflow rm --stop --force airflow-webserver airflow-scheduler airflow-init

      - name: Build silver from the real bronze (Spark over S3A)
        # Real Spark reading the real bronze through S3A as the pipeline user.
        # Reports go to files: the JVM shares stdout with Python.
        run: |
          make --no-print-directory silver SILVER_ARGS="--report silver-1.json"
          cat silver-1.json
          jq -e 'length == 6 and all(.[]; .ok)' silver-1.json
          jq -e '.[] | select(.table == "punctuality_monthly") | .rows >= 4000' silver-1.json
          jq -e '.[] | select(.table == "stations") | .rows >= 1500' silver-1.json
          jq -e '.[] | select(.table == "weather_daily") | .rows >= 3000' silver-1.json
          # Derived tables: 3 departments x 12+ covered months; ~100+ TGV routes.
          jq -e '.[] | select(.table == "weather_monthly") | .rows >= 36' silver-1.json
          jq -e '.[] | select(.table == "route_departments") | .rows >= 100' silver-1.json
          # The weather join keeps the punctuality grain: never loses or adds a row.
          jq -e '(.[] | select(.table == "route_weather_monthly") | .rows)
            == (.[] | select(.table == "punctuality_monthly") | .rows)' silver-1.json
          # Silver only cleans and de-duplicates: it never invents punctuality rows.
          jq -e --slurpfile ing ingest-1.json '
            (.[] | select(.table == "punctuality_monthly") | .rows + .rejected)
            <= ($ing[0][] | select(.dataset == "punctuality") | .rows)' silver-1.json

      - name: Silver passes its contract (schema, unique keys)
        run: |
          make --no-print-directory verify-silver SILVER_ARGS="--report verify-silver-1.json"
          jq -e 'length == 6 and all(.[]; .ok and .duplicate_keys == 0 and .null_keys == 0)' \
            verify-silver-1.json
          jq -e --slurpfile job silver-1.json \
            '[.[] | {table, rows}] == [$job[0][] | {table, rows}]' verify-silver-1.json
          # The join must match, not just keep its grain: with weather for Paris,
          # Lyon and Marseille, the routes between them carry weather at both ends.
          jq '.[] | select(.profile != {}) | {table, profile}' verify-silver-1.json
          jq -e '.[] | select(.table == "route_weather_monthly") | .profile.weather_endpoints
            | (.["2"] // 0) >= 12 and ((.["1"] // 0) + (.["2"] // 0)) >= 24' verify-silver-1.json
          jq -e '.[] | select(.table == "route_weather_monthly")
            | ([.profile.weather_endpoints[]] | add) == .rows' verify-silver-1.json

      - name: Re-running silver does not duplicate rows
        # Partition overwrite: same bronze in, same row counts out, keys still unique.
        run: |
          make --no-print-directory silver SILVER_ARGS="--report silver-2.json"
          jq -e --slurpfile one silver-1.json \
            '[.[] | {table, rows, rejected}] == [$one[0][] | {table, rows, rejected}]' silver-2.json
          make --no-print-directory verify-silver SILVER_ARGS="--report verify-silver-2.json"
          jq -e --slurpfile one verify-silver-1.json \
            '[.[] | {table, rows}] == [$one[0][] | {table, rows}] and all(.[]; .ok)' \
            verify-silver-2.json

      - name: Load silver into the warehouse raw schema (Spark -> Postgres)
        # Real silver over S3A, real Postgres as railfall_loader (WAREHOUSE_DSN
        # from .env). Fresh warehouse: every staged row is an insert.
        run: |
          make --no-print-directory load LOAD_ARGS="--report load-1.json"
          cat load-1.json
          jq -e 'length == 6 and all(.[]; .ok and .scope == "full")' load-1.json
          jq -e 'all(.[]; .staged > 0 and .inserted == .staged and .updated == 0 and .deleted == 0)' \
            load-1.json
          # The warehouse gets exactly what silver built, table by table.
          jq -e --slurpfile silver silver-2.json \
            '([.[] | {table, rows: .staged}] | sort_by(.table))
             == ([$silver[0][] | {table, rows}] | sort_by(.table))' load-1.json

      - name: Warehouse matches silver (columns, primary key, counts per year)
        run: |
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-1.json"
          jq -e 'length == 6 and all(.[]; .ok and .duplicate_keys == 0 and .null_keys == 0)' \
            verify-load-1.json
          jq -e 'all(.[]; .rows == .silver_rows and (.primary_key | length) > 0)' verify-load-1.json
          jq -e '.[] | select(.table == "punctuality_monthly") | .by_year | length >= 1' \
            verify-load-1.json

      - name: Re-running the load does not duplicate or rewrite rows
        # Same silver in -> nothing inserted, updated or deleted; counts unchanged.
        run: |
          make --no-print-directory load LOAD_ARGS="--report load-2.json"
          cat load-2.json
          jq -e 'length == 6 and all(.[]; .ok)' load-2.json
          jq -e 'all(.[]; .inserted == 0 and .updated == 0 and .deleted == 0
            and .unchanged == .staged)' load-2.json
          # Each run is logged under its own run_id, shared by all its tables.
          jq -e --slurpfile one load-1.json \
            '([.[].run_id] | unique | length == 1)
             and .[0].run_id != $one[0][0].run_id and .[0].run_id != ""' load-2.json
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-2.json"
          jq -e --slurpfile one verify-load-1.json \
            '[.[] | {table, rows, by_year}] == [$one[0][] | {table, rows, by_year}]
             and all(.[]; .ok and .duplicate_keys == 0)' verify-load-2.json

      - name: Incremental load of the latest year repairs only that year
        # Simulate drift as the admin: drop the latest year of punctuality from
        # the warehouse. `--year` must restore exactly those rows, leave every
        # other year untouched, and still reload the small reference tables in full.
        run: |
          year=$(jq -r '.[] | select(.table == "punctuality_monthly") | .by_year | keys
            | map(tonumber) | max' verify-load-1.json)
          echo "latest year: $year"
          docker compose exec -T postgres psql -U rail -d warehouse -v ON_ERROR_STOP=1 \
            -c "delete from raw.punctuality_monthly where year = $year"
          make --no-print-directory load LOAD_ARGS="--year $year --report load-3.json"
          cat load-3.json
          jq -e 'length == 6 and all(.[]; .ok and .updated == 0 and .deleted == 0)' load-3.json
          # Year-partitioned tables are scoped to $year and stage exactly its rows;
          # unpartitioned ones load in full.
          jq -e --slurpfile v verify-load-1.json --arg y "$year" '
            ($v[0] | map({(.table): .by_year}) | add) as $by
            | all(.[]; if ($by[.table] | length) > 0
                then .scope == ("year=" + $y) and .staged == ($by[.table][$y] // 0)
                else .scope == "full" end)' load-3.json
          # Only the dropped rows come back; everything else is a no-op.
          jq -e --slurpfile v verify-load-1.json --arg y "$year" '
            ($v[0][] | select(.table == "punctuality_monthly") | .by_year[$y]) as $n
            | $n > 0
              and (.[] | select(.table == "punctuality_monthly") | .inserted == $n)
              and ([.[] | select(.table != "punctuality_monthly") | .inserted] | add == 0)
            ' load-3.json
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-3.json"
          jq -e --slurpfile one verify-load-1.json \
            '[.[] | {table, rows, by_year}] == [$one[0][] | {table, rows, by_year}]
             and all(.[]; .ok and .duplicate_keys == 0)' verify-load-3.json

      - name: Restart Airflow for the full pipeline
        # Same image (cached) and metadata DB as before; Spark now runs inside
        # the worker, so the CLI Spark steps above are already finished.
        run: |
          make airflow AIRFLOW_USE_JOB_SCHEDULE=false
          curl -fsS "http://localhost:8080/health" | jq -e \
            '.metadatabase.status == "healthy" and .scheduler.status == "healthy"'

      - name: railfall_pipeline DAG runs to success (ingest -> Spark -> load)
        # The whole chain in one DAG run on the real sources, the real lake and
        # the real warehouse, triggered over the REST API and awaited. It runs
        # over a stack the CLI steps already filled, so it must converge on the
        # same state: no new bronze, same silver, nothing to merge.
        run: |
          make dag-run DAG=railfall_pipeline \
            DAG_ARGS="--conf '{\"ingest_date\": \"$(date -u +%F)\"}' --timeout 2400 --xcom --report dag-pipeline.json"
          jq '{state, duration_s, tasks: [.tasks[] | {task_id, map_index, state, duration_s}]}' \
            dag-pipeline.json
          jq -e '.state == "success"' dag-pipeline.json
          jq -e '[.tasks[] | select(.state != "success")] | length == 0' dag-pipeline.json
          jq -e '[.tasks[].task_id] | unique == ["build_silver", "check_raw_quality",
            "ingest_meteo", "ingest_sncf", "load_warehouse", "verify_meteo", "verify_silver",
            "verify_sncf", "verify_warehouse"]' \
            dag-pipeline.json
          jq -e '[.tasks[] | select(.task_id == "ingest_meteo")] | length == 3' dag-pipeline.json
          # Spark ran in the Airflow worker over S3A: six valid silver tables, unique keys.
          jq -e 'def r(id): [.tasks[] | select(.task_id == id) | .result[]];
            (r("build_silver") | length == 6 and all(.ok))
            and (r("verify_silver") | length == 6
              and all(.ok and .duplicate_keys == 0 and .null_keys == 0))
            and ([r("build_silver")[] | {table, rows}] | sort_by(.table))
              == ([r("verify_silver")[] | {table, rows}] | sort_by(.table))' dag-pipeline.json
          # The load staged exactly what the DAG built, and the warehouse matches it.
          jq -e 'def r(id): [.tasks[] | select(.task_id == id) | .result[]];
            (r("load_warehouse") | length == 6 and all(.ok and .scope == "full"))
            and ([r("load_warehouse")[] | {table, rows: .staged}] | sort_by(.table))
              == ([r("build_silver")[] | {table, rows}] | sort_by(.table))
            and (r("verify_warehouse") | length == 6 and all(.ok and .rows == .silver_rows
              and .duplicate_keys == 0 and .null_keys == 0))' dag-pipeline.json
          # The Great Expectations gate validated every raw suite, with nothing failing.
          jq -e 'def r(id): [.tasks[] | select(.task_id == id) | .result[]];
            r("check_raw_quality") as $q
            | ([$q[].table] | sort) == ["punctuality_monthly", "route_departments",
                "stations", "weather_daily", "weather_monthly"]
              and ($q | all(.ok and .evaluated > 0 and (.failures | length == 0)))' \
            dag-pipeline.json
          # Same bronze as the CLI steps -> same silver and a no-op merge. (If a
          # source republished in between, the counts above still had to agree.)
          jq -e --slurpfile silver silver-2.json --slurpfile wh verify-load-1.json '
            def r(id): [.tasks[] | select(.task_id == id) | .result[]];
            if [r("ingest_sncf")[], r("ingest_meteo")[]] | all(.status == "skipped") then
              ([r("build_silver")[] | {table, rows, rejected}] | sort_by(.table))
                == ([$silver[0][] | {table, rows, rejected}] | sort_by(.table))
              and (r("load_warehouse") | all(.inserted == 0 and .updated == 0
                and .deleted == 0 and .unchanged == .staged))
              and ([r("verify_warehouse")[] | {table, rows, by_year}] | sort_by(.table))
                == ([$wh[0][] | {table, rows, by_year}] | sort_by(.table))
            else true end' dag-pipeline.json

      - name: Remove Airflow containers again
        run: docker compose --profile airflow rm --stop --force airflow-webserver airflow-scheduler airflow-init

      - name: The DAG left the warehouse as it reported
        # Read back with the CLI, outside Airflow: same counts, keys still unique.
        run: |
          make --no-print-directory verify-load LOAD_ARGS="--report verify-load-dag.json"
          jq -e --slurpfile dag dag-pipeline.json '
            ([.[] | {table, rows}] | sort_by(.table))
              == ([$dag[0].tasks[] | select(.task_id == "verify_warehouse") | .result[]
                   | {table, rows}] | sort_by(.table))
            and all(.[]; .ok and .duplicate_keys == 0)' verify-load-dag.json

      - name: Great Expectations checkpoint agrees with the DAG's gate
        # Same suites, run from the CLI as the transformer role outside Airflow:
        # every raw table passes and the per-table results match the DAG's XCom.
        run: |
          make --no-print-directory quality \
            QUALITY_ARGS="--report quality-1.json --markdown quality-1.md"
          jq -e 'length == 5 and all(.ok and .evaluated > 0 and (.failures | length == 0))' \
            quality-1.json
          jq -e --slurpfile dag dag-pipeline.json '
            ([.[] | {table, evaluated}] | sort_by(.table))
              == ([$dag[0].tasks[] | select(.task_id == "check_raw_quality") | .result[]
                   | {table, evaluated}] | sort_by(.table))' quality-1.json
          grep -q 'checkpoint passed' quality-1.md
          cat quality-1.md >> "$GITHUB_STEP_SUMMARY"

      - name: The quality gate fails on corrupted copies of the real tables
        # Canary: each raw table is copied (as the loader), one row of the copy
        # is corrupted, and the real suite must fail on the targeted expectation.
        # The copies are dropped and the real tables still pass afterwards.
        run: |
          make --no-print-directory quality-canary QUALITY_ARGS="--report canary.json"
          jq -e 'length == 5 and all(.caught)' canary.json
          jq -e '[.[].table] | sort == ["punctuality_monthly", "route_departments",
            "stations", "weather_daily", "weather_monthly"]' canary.json
          leftovers=$(docker compose exec -T postgres psql -U rail -d warehouse -Atc \
            "select count(*) from pg_tables where schemaname = 'raw' and tablename like '\_canary\_%'")
          test "$leftovers" = 0
          make --no-print-directory quality QUALITY_ARGS="--report quality-2.json"
          jq -e --slurpfile before quality-1.json '. == $before[0]' quality-2.json

      - name: Upload the data-quality reports
        # Checkpoint results and the canary's verdicts, kept with the run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-reports
          path: |
            quality-*.json
            quality-*.md
            canary.json
          if-no-files-found: ignore

      - name: dbt reaches the warehouse as the transformer role
        run: make --no-print-directory dbt-debug

      - name: Raw sources are fresh (dbt source freshness)
        # The loader stamps `_updated_at`; the DAG has just merged today's data,
        # so every declared raw source must pass its freshness check, not warn.
        run: |
          make --no-print-directory dbt-freshness DBT_ARGS="--report dbt-freshness.json"
          jq -e '
            .ok and (.errors | length == 0)
            and (.nodes | length == 6)
            and all(.nodes[]; .resource_type == "source" and .status == "pass")' dbt-freshness.json

      - name: dbt build staging on the real raw tables
        # Models and their tests in DAG order; every node must pass, and the
        # report must cover the five staging views and their tests.
        run: |
          make --no-print-directory dbt-build DBT_ARGS="--select staging --report dbt-build-1.json"
          jq -e '
            .ok and (.errors | length == 0)
            and ([.nodes[] | select(.resource_type == "model")] | length == 5
                 and all(.status == "success"))
            and ([.nodes[] | select(.resource_type == "test")] | length >= 28
                 and all(.status == "pass" or .status == "warn"))
            and ([.nodes[] | select(.status == "warn") | .unique_id]
                 | all(test("^test\\.railfall\\.accepted_range_.*pct_cause_")))' dbt-build-1.json
          # Warn-severity tests (AQST cause shares) are reported, never hidden.
          jq -r '.nodes[] | select(.status == "warn") | "warning: \(.unique_id)"' dbt-build-1.json

      - name: Staging matches raw (views, row counts, unique grain)
        # Checked outside dbt, as the transformer role: each view holds exactly
        # the rows the loader reported for its raw table.
        run: |
          make --no-print-directory verify-staging DBT_VERIFY_ARGS="--report verify-staging-1.json"
          jq -e --slurpfile raw verify-load-dag.json '
            ($raw[0] | map({(.table): .rows}) | add) as $n
            | length == 5
              and all(.[]; .ok and .kind == "view" and .rows > 0
                           and .rows == $n[.relation | sub("^staging\\.stg_[a-z]+__"; "")]
                           and .duplicate_keys == 0 and .null_keys == 0)' verify-staging-1.json

      - name: Re-running dbt build is idempotent
        # Views are replaced, not appended to: same nodes, same results, same rows.
        run: |
          make --no-print-directory dbt-build DBT_ARGS="--select staging --report dbt-build-2.json"
          jq -e --slurpfile one dbt-build-1.json '
            .ok and ([.nodes[] | {unique_id, status}] | sort)
              == ([$one[0].nodes[] | {unique_id, status}] | sort)' dbt-build-2.json
          make --no-print-directory verify-staging DBT_VERIFY_ARGS="--report verify-staging-2.json"
          jq -e --slurpfile one verify-staging-1.json \
            '[.[] | {model, rows}] == [$one[0][] | {model, rows}] and all(.[]; .ok)' \
            verify-staging-2.json

      - name: dbt build the star schema on the real staging views
        # Seed + dims + facts + weather-impact marts and their tests. Marts are
        # tables, so this is the first step where dbt writes data; it must pass
        # on the real months.
        run: |
          make --no-print-directory dbt-build \
            DBT_ARGS="--select departments marts --report dbt-build-marts-1.json"
          jq -e '
            .ok and (.errors | length == 0)
            and ([.nodes[] | select(.resource_type == "seed")] | length == 1)
            and ([.nodes[] | select(.resource_type == "model")] | length == 9
                 and all(.status == "success"))
            and ([.nodes[] | select(.resource_type == "model") | .unique_id]
                 | index("model.railfall.int_route_month_weather") != null
                   and index("model.railfall.mart_punctuality_by_weather") != null
                   and index("model.railfall.mart_punctuality_by_region_season") != null
                   and index("model.railfall.mart_punctuality_by_weather_intensity") != null)
            and ([.nodes[] | select(.resource_type == "test")] | length >= 40
                 and all(.status == "pass"))' dbt-build-marts-1.json

      - name: Star schema and weather marts checked from outside dbt
        # Tables, unique non-null grain, and each fact holds exactly its source's
        # rows: the dimension joins neither dropped nor fanned out months. Each
        # weather mart covers rain, wind and frost and never invents trains.
        run: |
          make --no-print-directory verify-marts DBT_VERIFY_ARGS="--report verify-marts-1.json"
          jq -e 'length == 9 and all(.[]; .ok and .kind == "table" and .rows > 0)
            and ([.[] | select(.model | startswith("fact_")) | .rows == .source_rows]
                 | length == 2 and all)
            and ([.[] | select(.model == "int_route_month_weather")
                  | .rows == .source_rows] == [true])
            and ([.[] | select(.model | startswith("mart_"))
                  | .weather_factors == 3 and .trains_mismatches == 0]
                 | length == 3 and all)' verify-marts-1.json

      - name: Rebuilding the star schema is idempotent
        run: |
          make --no-print-directory dbt-build \
            DBT_ARGS="--select departments marts --report dbt-build-marts-2.json"
          jq -e --slurpfile one dbt-build-marts-1.json '
            .ok and ([.nodes[] | {unique_id, status}] | sort)
              == ([$one[0].nodes[] | {unique_id, status}] | sort)' dbt-build-marts-2.json
          make --no-print-directory verify-marts DBT_VERIFY_ARGS="--report verify-marts-2.json"
          jq -e --slurpfile one verify-marts-1.json \
            '[.[] | {model, rows}] == [$one[0][] | {model, rows}] and all(.[]; .ok)' \
            verify-marts-2.json

      - name: The reader sees the weather marts and the report renders
        # As railfall_reader (what dashboards use): proves dbt's tables carry the
        # default SELECT grant, and puts the real findings on the run summary.
        run: |
          make --no-print-directory weather-report \
            REPORT_ARGS="--out weather-report.md --report weather-report.json"
          jq -e '.ok and (.headlines | length == 3)
            and ([.binary[].weather_factor] | unique == ["frost", "rain", "wind"])
            and ([.intensity[] | select(.is_baseline)] | length == 3)
            and (.intensity | all(.route_months > 0))' weather-report.json
          cat weather-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: dbt docs generate on the live warehouse
        # The catalog is introspected from Postgres as the transformer role: a
        # relation dbt cannot read is a catalog error and fails the step.
        run: |
          make --no-print-directory dbt-docs DBT_ARGS="--report dbt-docs.json"
          jq -e '.ok and (.errors | length == 0)' dbt-docs.json
          for f in manifest.json catalog.json index.html static_index.html; do
            test -s "dbt/target/$f" || { echo "missing dbt/target/$f"; exit 1; }
          done

      - name: Lineage, doc coverage and schema drift (strict)
        # Every declared relation and column is described, everything dbt
        # declares exists in the warehouse with the declared columns.
        run: |
          make -s dbt-docs-bundle \
            DOCS_ARGS="--strict --out-dir dbt-docs-bundle" | tee dbt-docs-bundle.json
          jq -e '.ok and .relations >= 21 and .edges >= 24
            and .coverage.pct_columns_documented == 100
            and .drift.ok and (.drift.missing_relations | length == 0)
            and (.drift.missing_columns | length == 0)' dbt-docs-bundle.json
          jq -e '[.nodes[] | select(.layer == "marts")] | length >= 9' \
            dbt-docs-bundle/lineage.json
          for m in fact_route_month mart_punctuality_by_weather \
                   mart_punctuality_by_region_season mart_punctuality_by_weather_intensity; do
            grep -q "$m" dbt-docs-bundle/catalog.md || { echo "$m not in catalog.md"; exit 1; }
          done
          # The README catalog is generated from this same manifest: it must match.
          make -s dbt-docs-bundle DOCS_ARGS="--readme README.md --check"
          cp dbt/target/{static_index.html,index.html,manifest.json,catalog.json} dbt-docs-bundle/
          {
            echo "## dbt lineage"
            echo '```mermaid'
            cat dbt-docs-bundle/lineage.mmd
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish dbt docs + lineage
        # static_index.html opens from disk; the rest is the machine-readable
        # lineage / coverage / drift and the Markdown catalog.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt-docs-bundle/
          if-no-files-found: ignore

      - name: Dashboard specs only read marts dbt built on the live run
        # Offline check against the manifest of this very run: a card reading a
        # mart dbt no longer builds fails here, before Metabase is even started.
        run: |
          make --no-print-directory dashboards-check \
            DASHBOARDS_ARGS="--manifest dbt/target/manifest.json" | tee dashboards-check.txt
          grep -q "relations dbt builds in marts" dashboards-check.txt

      - name: Metabase boots on its Terraform-managed database
        # Real image, real Postgres: `make metabase` waits for /api/health, and
        # Metabase's own tables must land in the `metabase` database (not an
        # H2 file in the container, nor the warehouse).
        run: |
          make metabase
          curl -fsS "http://localhost:${METABASE_PORT:-3000}/api/health" | jq -e '.status == "ok"'
          tables=$(docker compose exec -T postgres psql -U rail -d metabase -tAc \
            "select count(*) from information_schema.tables where table_name = 'core_user'")
          test "$tables" = 1
          leaked=$(docker compose exec -T postgres psql -U rail -d warehouse -tAc \
            "select count(*) from information_schema.tables where table_name = 'core_user'")
          test "$leaked" = 0

      - name: Metabase is bootstrapped as code, idempotently
        # No setup wizard: the admin is created with the one-time setup token,
        # the warehouse is registered as railfall_reader (marts only) and synced
        # until every dashboard mart is visible. A second run must log in and
        # update in place: still exactly one warehouse connection.
        run: |
          make --no-print-directory dashboards METABASE_ARGS="--report metabase-1.json"
          docker compose exec -T postgres psql -U rail -d metabase -tAc \
            "select id from report_dashboardcard order by id" > dashcards-1.txt
          make --no-print-directory dashboards METABASE_ARGS="--report metabase-2.json"
          jq -e '.ok and .created_admin and .database_created and (.missing == [])' metabase-1.json
          jq -e '.ok and (.created_admin | not) and (.database_created | not)' metabase-2.json
          jq -e --slurpfile a metabase-1.json '.database_id == $a[0].database_id' metabase-2.json
          jq -e '.tables | index("mart_punctuality_by_weather") != null' metabase-2.json
          dbs=$(docker compose exec -T postgres psql -U rail -d metabase -tAc \
            "select count(*) from metabase_database where engine = 'postgres'
               and details::text like '%railfall_reader%'")
          test "$dbs" = 1

      - name: Dashboards are provisioned as code and every card returns rows
        # The spec under bi/dashboards is the source of truth. Run 1 creates every
        # card, run 2 updates the same questions in place (same card and dashcard
        # ids, nothing archived). Checked twice: in the bootstrap report and
        # straight in Metabase's application database. Every card was executed
        # by Metabase against the real marts and must return at least one row.
        run: |
          spec=bi/dashboards/weather_impact/dashboard.json
          n=$(jq '.cards | length' "$spec")
          name=$(jq -r '.name' "$spec")
          jq -e --arg name "$name" --argjson n "$n" '
            [.dashboards[] | select(.name == $name)] | length == 1 and
            (.[0] | .ok and .dashboard_created and (.created | length) == $n
              and .archived == [] and .failed == {} and .empty == [])' metabase-1.json
          jq -e --arg name "$name" --argjson n "$n" '
            .dashboards[] | select(.name == $name) | .ok and (.dashboard_created | not)
              and .created == [] and (.updated | length) == $n and .archived == []
              and ([.row_counts[]] | length == $n and all(. > 0))' metabase-2.json
          jq -e --slurpfile a metabase-1.json \
            '.dashboards[0].cards == $a[0].dashboards[0].cards
             and .dashboards[0].dashboard_id == $a[0].dashboards[0].dashboard_id' metabase-2.json
          jq -r '.dashboards[0].row_counts | to_entries[] | "\(.key): \(.value) rows"' metabase-2.json

          q() { docker compose exec -T postgres psql -U rail -d metabase -tAc "$1"; }
          test "$(q "select count(*) from collection
                     where name = 'Railfall' and not archived and personal_owner_id is null")" = 1
          dash_id=$(jq '.dashboards[0].dashboard_id' metabase-2.json)
          test "$(q "select count(*) from report_dashboard
                     where name = \$\$${name}\$\$ and not archived")" = 1
          test "$(q "select count(*) from report_card c join collection k on k.id = c.collection_id
                     where k.name = 'Railfall' and not c.archived
                       and c.query_type = 'native'")" = "$n"
          test "$(q "select count(*) from report_dashboardcard
                     where dashboard_id = ${dash_id}")" = "$n"
          q "select id from report_dashboardcard order by id" > dashcards-2.txt
          diff dashcards-1.txt dashcards-2.txt

      - name: Stop Metabase before the restart
        # Like Airflow, a profile container would keep the network busy during
        # `compose down`. Its state stays in Postgres.
        run: docker compose --profile bi rm --stop --force metabase

      - name: Re-apply is a no-op
        run: |
          make infra
          make infra-check

      - name: Data survives a restart
        # `down` keeps the named volumes. Restart *without* Terraform: the
        # lake-bucket check only passes if the bucket persisted on disk, and
        # the drift check proves roles and schemas survived too.
        run: |
          docker compose down
          docker compose up -d --wait postgres minio
          make health WAIT=60
          make infra-check
          make access
          make --no-print-directory verify-sncf
          make --no-print-directory verify-meteo
          make --no-print-directory verify-silver
          make --no-print-directory verify-load
          make --no-print-directory verify-staging
          make --no-print-directory verify-marts

      - name: Dump service logs
        if: failure()
        run: docker compose --profile airflow --profile bi logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile airflow --profile bi down -v
